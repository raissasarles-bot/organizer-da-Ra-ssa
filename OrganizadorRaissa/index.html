<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Organizer da Raíssa - Organize suas tarefas diárias, semanais e mensais">
    <meta name="theme-color" content="#a855f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Organizer da Raíssa">

    <title>Organizer da Raíssa</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>✨ Organizer da Raíssa</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                🌙
            </button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
        <button class="nav-tab active" data-view="today">📅 Hoje</button>
        <button class="nav-tab" data-view="week">📆 Semana</button>
        <button class="nav-tab" data-view="month">🗓️ Mês</button>
        <button class="nav-tab" data-view="categories">🏷️ Categorias</button>
    </nav>

    <!-- Main Container -->
    <main class="container">

        <!-- TODAY VIEW -->
        <div id="todayView" class="view active">

            <!-- Progress Section -->
            <section class="progress-section">
                <div class="progress-header">
                    <h3>Progresso de Hoje</h3>
                    <span class="progress-text" id="todayProgress">0 de 0 concluídas</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="todayProgressBar" style="width: 0%"></div>
                </div>
            </section>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn btn-primary" id="addTaskBtn">
                    ➕ Nova Tarefa
                </button>
            </div>

            <!-- Task List -->
            <div class="task-list" id="todayTaskList">
                <!-- Tasks will be rendered here -->
            </div>

            <!-- Empty State -->
            <div class="empty-state hidden" id="todayEmptyState">
                <div class="empty-state-icon">📝</div>
                <p class="empty-state-text">Nenhuma tarefa para hoje</p>
                <p style="color: var(--text-muted); font-size: var(--font-size-sm);">
                    Adicione uma nova tarefa para começar!
                </p>
            </div>
        </div>

        <!-- WEEK VIEW -->
        <div id="weekView" class="view">
            <h2 class="mb-lg">Visão Semanal</h2>
            <div class="week-grid" id="weekGrid">
                <!-- Week days will be rendered here -->
            </div>
        </div>

        <!-- MONTH VIEW -->
        <div id="monthView" class="view">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
                <button class="btn btn-secondary" id="prevMonth">← Anterior</button>
                <h2 id="monthTitle">Mês</h2>
                <button class="btn btn-secondary" id="nextMonth">Próximo →</button>
            </div>
            <div class="month-grid" id="monthGrid">
                <!-- Month calendar will be rendered here -->
            </div>
        </div>

        <!-- CATEGORIES VIEW -->
        <div id="categoriesView" class="view">
            <h2 class="mb-lg">Gerenciar Categorias</h2>

            <div class="action-buttons">
                <button class="btn btn-primary" id="addCategoryBtn">
                    ➕ Nova Categoria
                </button>
            </div>

            <div class="task-list" id="categoriesList">
                <!-- Categories will be rendered here -->
            </div>
        </div>

    </main>

    <!-- MODAL: Add/Edit Task -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="taskModalTitle">Nova Tarefa</h2>
                <button class="modal-close" id="closeTaskModal">×</button>
            </div>
            <div class="modal-body">
                <form id="taskForm">

                    <div class="form-group">
                        <label class="form-label" for="taskTitle">Título da Tarefa *</label>
                        <input type="text" id="taskTitle" class="form-input" placeholder="Ex: Passear com o cachorro"
                            required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="taskDescription">Descrição (opcional)</label>
                        <textarea id="taskDescription" class="form-textarea"
                            placeholder="Adicione detalhes sobre a tarefa..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Categoria *</label>
                        <div class="category-grid" id="categorySelector">
                            <!-- Categories will be rendered here -->
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="taskDate">Data *</label>
                        <input type="date" id="taskDate" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="taskRecurrence">Recorrência</label>
                        <select id="taskRecurrence" class="form-select">
                            <option value="none">Sem recorrência</option>
                            <option value="daily">Diária</option>
                            <option value="weekly">Semanal</option>
                            <option value="monthly">Mensal</option>
                        </select>
                    </div>

                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelTaskBtn">Cancelar</button>
                <button class="btn btn-primary" id="saveTaskBtn">Salvar Tarefa</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Add/Edit Category -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="categoryModalTitle">Nova Categoria</h2>
                <button class="modal-close" id="closeCategoryModal">×</button>
            </div>
            <div class="modal-body">
                <form id="categoryForm">

                    <div class="form-group">
                        <label class="form-label" for="categoryName">Nome da Categoria *</label>
                        <input type="text" id="categoryName" class="form-input" placeholder="Ex: Exercícios" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="categoryEmoji">Emoji *</label>
                        <input type="text" id="categoryEmoji" class="form-input" placeholder="Ex: 💪" maxlength="2"
                            required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="categoryColor">Cor *</label>
                        <input type="color" id="categoryColor" class="form-input" value="#a855f7" required>
                    </div>

                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelCategoryBtn">Cancelar</button>
                <button class="btn btn-primary" id="saveCategoryBtn">Salvar Categoria</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>

    <!-- PWA Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registrado!'))
                    .catch(err => console.log('Erro ao registrar Service Worker:', err));
            });
        }
    </script>

</body>

</html>
